{% extends "base.html" %}

{% block title %}{{ code }} Error | POAM Tracker{% endblock %}

{% block content %}
<div class="container-narrow" style="text-align: center; padding-top: 4rem;">
    <h1 style="font-size: 4rem; color: var(--primary); margin-bottom: 0.5rem;">{{ code }}</h1>
    <p style="font-size: 1.25rem; color: var(--text-light); margin-bottom: 2rem;">{{ message }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">Go to Dashboard</a>
</div>
{% endblock %}
